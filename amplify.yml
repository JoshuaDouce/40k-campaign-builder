version: 1
# npm install, not npm ci: Amplify packages bundle sub-packages whose dependencies npm ci rejects as "missing from lock file".
backend:
  phases:
    build:
      commands:
        - nvm install 24
        - nvm use 24
        - npm install --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - npm install --no-audit --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
