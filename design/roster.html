<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Varkesh Reach - Roster (design mock)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gothic:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Share+Tech+Mono&display=swap">
<style>
/* ===== Tokens and base: copied from reference/index.html ===== */
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
:root{
  --bg:#16120f; --panel:#211a16; --panel2:#2a211c; --line:#3d312a;
  --ink:#ebdfc8; --dim:#a8977f; --brass:#d0a952; --blood:#b8392e; --verd:#6f9a86;
  --f-display:"Grenze Gothic","Palatino Linotype",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header.hero{padding-block:28px 18px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,11vw,68px);line-height:.95;margin:6px 0 10px;text-wrap:balance;letter-spacing:.01em}
h1 span{color:var(--blood)}
.lede{color:var(--dim);max-width:62ch;margin:0}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);scrollbar-width:none;margin-inline:-4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:none;color:var(--dim);border:1px solid transparent;padding:8px 12px;border-radius:2px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--bg);background:var(--brass)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
section.tab{padding-block:22px}
h2{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:23px;margin:26px 0 6px;color:var(--brass);text-wrap:balance}
p{margin:0 0 12px;max-width:65ch}
.dim{color:var(--dim)}
.mono{font-family:var(--f-mono)}
ol.steps{list-style:none;padding:0;margin:18px 0;display:grid;gap:0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
ol.steps li::before{content:counter(s,upper-roman);font-family:var(--f-display);font-size:26px;color:var(--blood);line-height:1}
ol.steps li > div{min-width:0}
ol.steps b{display:block;font-size:17px}
.tbl{overflow-x:auto;margin:10px 0 16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:400}
td.n{font-family:var(--f-mono);color:var(--brass);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{font-family:var(--f-mono);font-size:13px;letter-spacing:.05em;text-transform:uppercase;background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:9px 14px;border-radius:2px;cursor:pointer}
.btn.primary{background:var(--brass);color:var(--bg);border-color:var(--brass)}
.btn.danger{color:var(--blood)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:11px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{border-left:3px solid var(--blood);padding:8px 12px;background:var(--panel);margin:14px 0;max-width:65ch}
.note b{color:var(--blood)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:20px;color:var(--dim);background:none;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--ink);background:var(--panel2)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
select,input[type=text],input[type=number]{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:7px 9px;max-width:100%}
.stat{background:var(--panel2);padding:8px;border-radius:2px;text-align:center}
.stat .l{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.msg{font-family:var(--f-mono);font-size:12px;color:var(--blood);min-height:1em}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 180px}
.field label,.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.twist{border-left:3px solid var(--blood);padding:4px 10px;margin:8px 0}

/* ===== Roster additions (new, built from the same tokens) ===== */
.rhead{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px;margin:12px 0}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.pick .chip{font-size:13px;padding:6px 11px}
.totals{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:12px 0}
.totals .v.over{color:var(--blood)}
.totals .v small{font-size:16px;color:var(--dim)}
.overline{font-family:var(--f-mono);font-size:12px;color:var(--blood);margin-top:6px}
.rp-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 12px 10px;margin:10px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.unit.legend{border-color:var(--brass);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.unit.danger{border-color:var(--blood)}
.unit .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.unit .t{font-family:var(--f-display);font-size:23px;line-height:1.1}
.unit.legend .t{color:var(--brass)}
.unit .pts{font-family:var(--f-mono);font-size:13px;white-space:nowrap;text-align:right}
.unit .pts b{font-family:var(--f-display);font-size:26px;font-weight:500;color:var(--ink);display:block;line-height:1}
.unit .pts s{color:var(--dim)}
.unit .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid var(--line);color:var(--ink);background:var(--panel2)}
.badge.ex{color:var(--dim);border-style:dashed}
.badge.char{border-color:var(--brass);color:var(--brass)}
.badge.war{background:var(--brass);color:var(--bg);border-color:var(--brass)}
.badge.hon{border-color:var(--verd);color:var(--verd)}
.badge.scar{border-color:var(--blood);color:var(--blood)}
.badge.legend{background:var(--brass);color:var(--bg);border-color:var(--brass)}
.badge.warn{background:var(--blood);color:var(--ink);border-color:var(--blood)}
.xp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--f-mono);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.bar.close i{background:var(--verd)}
.unit .enh{border-left:3px solid var(--brass);padding:2px 10px;font-size:14.5px}
.unit .enh span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block}
.unit .warnline{font-family:var(--f-mono);font-size:12px;color:var(--blood)}
.unit .acts{display:flex;gap:6px;margin-top:4px;justify-content:flex-end}
.empty{text-align:center;border:1px dashed var(--line);border-radius:3px;padding:28px 16px;margin:14px 0;background:var(--panel)}
.empty b{font-family:var(--f-display);font-size:26px;font-weight:500;display:block}
.empty p{margin-inline:auto}
.ro{font-family:var(--f-mono);font-size:12px;color:var(--dim);border:1px dashed var(--line);padding:6px 10px;border-radius:2px;margin:6px 0}

/* panels: form, post-battle, dialogs */
.panel{background:var(--panel);border:1px solid var(--brass);border-radius:3px;padding:16px;margin:12px 0}
.panel h4{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0 0 2px;line-height:1.05}
.formgrid{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{font-size:12.5px}
.sub{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.pbunit{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:12px;margin:8px 0}
.pbunit.off{opacity:.6}
.pbunit .nm{font-family:var(--f-display);font-size:20px;line-height:1.1}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper output{font-family:var(--f-display);font-size:24px;min-width:1.4em;text-align:center}
.xpprev{font-family:var(--f-mono);font-size:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.xpprev .gain{color:var(--verd);font-size:14px}
.xpprev input{width:64px}
.res{border-top:1px solid var(--line);padding:12px 0}
.res .rt{font-family:var(--f-display);font-size:21px;line-height:1.1}
.out{font-family:var(--f-mono);font-size:12.5px;padding:6px 10px;margin-top:8px;border-left:3px solid var(--verd);background:var(--bg)}
.out.bad{border-color:var(--blood);color:var(--blood)}
.out.gone{border-color:var(--blood);background:var(--blood);color:var(--ink)}
.diebtn{display:inline-flex;gap:6px;align-items:center}
.die{font-family:var(--f-display);font-size:22px;color:var(--brass);min-width:2ch;text-align:center}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0}
.overlay .sheet{background:var(--panel);border:1px solid var(--brass);border-radius:6px 6px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px}
@media (min-width:600px){.overlay{align-items:center;padding:16px}.overlay .sheet{border-radius:4px}}
.picklist{display:grid;gap:6px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--brass);background:var(--bg)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt small{display:block;color:var(--dim);font-size:13.5px}
.seg{display:flex;gap:0}
.seg .chip{border-radius:0}
.seg .chip:first-child{border-radius:20px 0 0 20px}
.seg .chip:last-child{border-radius:0 20px 20px 0}
.toast{font-family:var(--f-mono);font-size:12px;color:var(--verd);min-height:1em;margin-top:6px}

/* mock-only: reviewer's jump bar (not part of the product) */
.mockbar{border:1px dashed var(--line);border-radius:3px;padding:8px 10px;margin:14px 0 0;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.mockbar .chips{margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="eyebrow">Narrative campaign · 500 → 2000 pts</div>
  <h1>The Varkesh <span>Reach</span></h1>
</header>

<nav class="tabs" role="tablist" aria-label="Campaign sections">
  <button role="tab">Pitch</button>
  <button role="tab">War Room</button>
  <button role="tab">Turn Guide</button>
  <button role="tab">Map</button>
  <button role="tab" aria-selected="true">Roster</button>
  <button role="tab">Rules</button>
  <button role="tab">Fate Deck</button>
  <button role="tab">Factions</button>
  <button role="tab">Players</button>
</nav>

<div class="mockbar" aria-label="Design mock jump bar">
  MOCK ONLY - jump to a state:
  <div class="chips" id="jump"></div>
</div>

<section class="tab" id="roster">
  <div id="main"></div>
  <div id="pb" hidden></div>
</section>
</div>
<div id="overlay" class="overlay" hidden></div>

<script>
/* ---------- Rules data (names verbatim from RulesTab) ---------- */
const HONOURS=[
 ["Steady Aim",`Re-roll hit rolls of 1 with ranged attacks.`],
 ["Brawlers",`Re-roll wound rolls of 1 in melee.`],
 ["Grizzled",`+1 to Battle-shock and Leadership tests.`],
 ["Fleet",`+1" to Move.`],
 ["Hard to Kill",`+1 to its roll for the fallen after battle.`],
 ["Objective Hunters",`+1 OC.`]];
const SCARS=[
 ["Shaken",`−1 to Battle-shock tests.`],
 ["Crippled",`−1" Move, cannot Advance and charge.`],
 ["Worn Gear",`Worsen BS or WS of one weapon by 1.`]];
const RANKS=[["Green",0,0],["Blooded",3,1],["Veteran",8,2],["Elite",15,3],["Legend of the Reach",25,4]];
const rankIdx=xp=>RANKS.reduce((a,r,i)=>xp>=r[1]?i:a,0);
const slots=xp=>RANKS[rankIdx(xp)][2];
const effPts=u=>Math.round(u.base*(1+0.1*u.honours.length)/5)*5;

/* ---------- Mock state ---------- */
const PLAYERS=[
 {id:"me",name:"Ninth Muster (you)",fac:"Adeptus Astartes",c:"var(--brass)",supply:1050,rp:4},
 {id:"p2",name:"Grot-Hammer Boyz",fac:"Orks",c:"var(--blood)",supply:900,rp:2},
 {id:"p3",name:"Tomb of Karesh",fac:"Necrons",c:"var(--verd)",supply:900,rp:3}];
let viewing="me", nextId=100;
const u=(id,name,ds,base,xp,hon,scars,o={})=>({id,name,ds,base,xp,honours:hon,scars,ex:true,char:false,war:false,enh:"",legendName:"",...o});
let units={
 me:[
  u(1,"Anvil Squad","Intercessor Squad",180,1,[],[]),
  u(2,"Red Hand Assault","Assault Intercessor Squad",150,4,["Brawlers"],[]),
  u(3,"Ashfall Gun-Line","Hellblasters",110,9,["Steady Aim","Fleet"],[{n:"Shaken"}]),
  u(4,"Captain Idris Valen","Captain",85,6,["Grizzled"],[],{char:true,war:true,enh:"Gilded Standard of the Ninth: friendly units within 6\" re-roll Battle-shock tests."}),
  u(5,"Gatekeepers","Bladeguard Veteran Squad",150,7,["Objective Hunters"],[]),
  u(6,"Breach Team Seven","Eradicator Squad",100,4,["Hard to Kill"],[{n:"Crippled"},{n:"Worn Gear",w:"melta rifles"}]),
  u(7,"The Anvil of Kharst","Redemptor Dreadnought",210,26,["Steady Aim","Grizzled","Hard to Kill","Objective Hunters"],[],{legendName:"The Anvil of Kharst"})],
 p2:[
  u(21,"Skullkrumpa's Boyz","Boyz",90,5,["Brawlers"],[]),
  u(22,"Big Mek Gutzgrind","Big Mek",75,2,[],[],{char:true,war:true,enh:"Kustom Force Field Rig"})],
 p3:[]};
let msg="";

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const me=()=>PLAYERS.find(p=>p.id==="me");
const cur=()=>PLAYERS.find(p=>p.id===viewing);
const mine=()=>viewing==="me";
const total=id=>units[id].reduce((a,x)=>a+effPts(x),0);

/* ---------- Roster tab ---------- */
function unitCard(x,own){
  const ri=rankIdx(x.xp), r=RANKS[ri], next=RANKS[ri+1];
  const legend=ri===4, dng=x.scars.length>=2;
  const pct=next?Math.round((x.xp-r[1])/(next[1]-r[1])*100):100;
  const short=next?next[1]-x.xp:0;
  const eff=effPts(x);
  return `<article class="unit${legend?" legend":""}${dng?" danger":""}">
   <div class="top"><div style="min-width:0">
     <div class="k"><span>${esc(x.ds)}</span></div>
     <div class="t">${esc(x.name)}</div></div>
     <div class="pts"><b>${eff} pts</b>${x.honours.length?`<s>${x.base} base</s> +${eff-x.base}`:`<span class="dim">${x.base} base</span>`}</div></div>
   <div class="badges">
     ${x.ex?`<span class="badge ex">Example</span>`:""}
     ${legend?`<span class="badge legend">Legend of the Reach</span>`:`<span class="badge">${r[0]}</span>`}
     ${x.war?`<span class="badge war">Warlord</span>`:""}${x.char?`<span class="badge char">Character</span>`:""}
   </div>
   <div class="xp"><span>${x.xp} XP</span>
     <div class="bar${next&&short===1?" close":""}" role="progressbar" aria-valuenow="${x.xp}" aria-valuemax="${next?next[1]:x.xp}"><i style="width:${pct}%"></i></div>
     <span>${next?(short===1?`<b style="color:var(--verd)">1 XP to ${next[0]}</b>`:`${short} to ${next[0]}`):"Max rank"}</span></div>
   ${x.honours.length||x.scars.length?`<div class="badges">
     ${x.honours.map(h=>`<span class="badge hon" title="${esc(HONOURS.find(a=>a[0]===h)[1])}">${esc(h)}</span>`).join("")}
     ${x.scars.map(s=>`<span class="badge scar" title="${esc(SCARS.find(a=>a[0]===s.n)[1])}">${esc(s.n)}${s.w?`: ${esc(s.w)}`:""}</span>`).join("")}</div>`:""}
   ${x.enh?`<div class="enh"><span>Enhancement</span>${esc(x.enh)}</div>`:""}
   ${legend?`<div class="warnline" style="color:var(--brass)">Named in the campaign log: ${esc(x.legendName||x.name)}</div>`:""}
   ${dng?`<div class="warnline">2 scars. One more and this unit is gone.</div>`:""}
   ${own?`<div class="acts"><button class="btn sm" data-edit="${x.id}">Edit</button><button class="btn sm danger" data-rm="${x.id}">Remove</button></div>`:""}
  </article>`;
}

function renderMain(){
  const p=cur(), own=mine(), list=units[p.id], tot=total(p.id), over=tot>p.supply;
  const hasEx=list.some(x=>x.ex);
  const me_=me();
  $("#main").innerHTML=`
   <h2>Roster</h2>
   <p class="dim">Your units, their XP, honours and scars. The War Room doesn't track these; this is your paper roster made digital. Points over supply only warn, they never block.</p>
   <div class="rhead">
     <div class="lbl">Roster of</div>
     <div class="pick" role="group" aria-label="Choose a player's roster">
       ${PLAYERS.map(q=>`<button class="chip" aria-pressed="${q.id===viewing}" data-pl="${q.id}"><span class="dot" style="background:${q.c}"></span>${esc(q.name)}</button>`).join("")}
     </div>
     <div class="mono dim" style="font-size:12px">${esc(p.fac.toUpperCase())}</div>
     <div class="totals">
       <div class="stat"><div class="l">Total points</div><div class="v ${over?"over":""}">${tot.toLocaleString()} <small>/ ${p.supply.toLocaleString()} pts</small></div>
         ${over?`<div class="overline">${tot-p.supply} over supply. Allowed, but your opponent will notice.</div>`:`<div class="mono dim" style="font-size:12px;margin-top:4px">${p.supply-tot} pts to spare</div>`}</div>
       <div class="stat"><div class="l">RP available</div><div class="v">${p.rp}</div></div>
     </div>
     ${own?`<div class="row">
        <button class="btn primary" id="add">Add unit</button>
        <button class="btn" id="pbh" ${list.length?"":"disabled"}>Post-battle helper</button>
        ${hasEx?`<button class="btn danger" id="clrex">Clear examples</button>`:`<button class="btn" id="addex">Add example units</button>`}
      </div>
      <div class="lbl" style="margin-top:12px">Spend Requisition</div>
      <div class="rp-row">
        <button class="btn sm" data-rp="surgeon" ${me_.rp<1?"disabled":""}>Field Surgeon · 1 RP</button>
        <button class="btn sm" data-rp="promo" ${me_.rp<1?"disabled":""}>Promotion · 1 RP</button>
        <button class="btn sm" data-rp="recruits" ${me_.rp<2?"disabled":""}>Seasoned Recruits · 2 RP</button>
      </div>`
      :`<div class="ro">READ-ONLY: you're viewing ${esc(p.name)}'s roster. Only they (or the campaign owner) can change it.</div>`}
     <div class="toast">${esc(msg)}</div>
   </div>
   ${list.length?list.map(x=>unitCard(x,own)).join(""):emptyState(own,p)}`;
}
function emptyState(own,p){
  return own?`<div class="empty"><b>No units yet</b>
    <p class="dim">The muster roll is blank. Add your first squad, or drop in a handful of example units to see how a roster looks. You can clear them in one tap.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="add2">Add unit</button><button class="btn" id="addex2">Add example units</button></div></div>`
   :`<div class="empty"><b>Nothing mustered</b><p class="dim">${esc(p.name)} hasn't added any units yet.</p></div>`;
}
$("#main").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;

/* ---------- 4. Add / edit unit form ---------- */

    ${f.char?`<div class="field" style="margin-top:10px"><label>Enhancement (optional)</label><input type="text" id="f_enh" value="${esc(f.enh)}" placeholder="Enhancement name and effect"></div>`:""}
  </div>

function readForm(f){
  const g=id=>document.getElementById(id);
  if(g("f_name"))f.name=g("f_name").value; if(g("f_ds"))f.ds=g("f_ds").value;
  if(g("f_base"))f.base=+g("f_base").value||0; if(g("f_xp"))f.xp=+g("f_xp").value||0;
  if(g("f_enh"))f.enh=g("f_enh").value;
  if(g("f_wgw")){const s=f.scars.find(a=>a.n==="Worn Gear");if(s)s.w=g("f_wgw").value}
}
function bindForm(f,mode,rerender,save){
  const o=$("#overlay");
  o.onclick=e=>{
    if(e.target.id==="overlay")return closeOverlay();
    const b=e.target.closest("button"); if(!b) return;
    readForm(f);
    if(b.id==="f_char"){f.char=!f.char;if(!f.char){f.war=false;f.enh=""}return rerender()}
    if(b.id==="f_war"){f.war=!f.war;return rerender()}
    if(b.dataset.hon){const h=b.dataset.hon;f.honours=f.honours.includes(h)?f.honours.filter(x=>x!==h):[...f.honours,h];return rerender()}
    if(b.dataset.scar){const s=b.dataset.scar;f.scars=f.scars.some(a=>a.n===s)?f.scars.filter(a=>a.n!==s):[...f.scars,{n:s}];return rerender()}
    if(b.id==="cancel")return closeOverlay();
    if(b.id==="save")return save();
  };
  o.oninput=e=>{ if(e.target.id==="f_xp"||e.target.id==="f_base"){readForm(f);const pos=e.target.id,v=e.target.value;rerender();const n=document.getElementById(pos);n.focus();n.value=v;} };
}
function openForm(existing){
  const f=existing?JSON.parse(JSON.stringify(existing)):{name:"",ds:"",base:100,xp:0,honours:[],scars:[],char:false,war:false,enh:"",legendName:"",ex:false};
  const draw=()=>{
    showOverlay(`<h4 style="font-family:var(--f-display);font-size:28px;margin:0">${existing?"Edit unit":"Add unit"}</h4>
      <p class="dim">Rank is worked out from XP. Effective points add 10% per honour, rounded to the nearest 5.</p>

      <div class="row sub"><button class="btn primary" id="save">${existing?"Save changes":"Add to roster"}</button><button class="btn" id="cancel">Cancel</button></div>`);
  };
  draw(); bindForm(f,"unit",draw,()=>{
    if(!f.name.trim()){f.name="Unnamed squad"}
    if(f.war)units.me.forEach(x=>{if(x.id!==f.id)x.war=false});
    if(existing)Object.assign(existing,f); else {f.id=nextId++;units.me.push(f)}
    msg=existing?"Unit updated.":"Unit added.";closeOverlay();renderMain();
  });
}

/* ---------- 6. RP dialogs ---------- */
function spend(n,text){me().rp-=n;msg=text+` (-${n} RP)`;closeOverlay();renderMain()}
function openRP(kind){
  if(kind==="surgeon"){
    const cands=units.me.filter(x=>x.scars.length);
    let uid=null, si=null;
    const draw=()=>{
      const x=cands.find(c=>c.id===uid);
      showOverlay(`<h4 style="font-family:var(--f-display);font-size:28px;margin:0">Field Surgeon</h4>
       <p class="dim">1 RP. Remove one Battle Scar. You have ${me().rp} RP.</p>
       <div class="lbl">1. Choose a unit with scars</div>
       <div class="picklist">${cands.length?cands.map(c=>`<button class="opt" aria-pressed="${c.id===uid}" data-u="${c.id}"><div><b>${esc(c.name)}</b><small>${esc(c.ds)} · ${c.scars.length} scar${c.scars.length>1?"s":""}</small></div></button>`).join(""):`<p class="dim">No unit has a scar. Nothing to mend.</p>`}</div>
       ${x?`<div class="lbl" style="margin-top:12px">2. Choose the scar to remove</div><div class="picklist">${x.scars.map((s,i)=>`<button class="opt" aria-pressed="${i===si}" data-s="${i}"><div><b>${esc(s.n)}${s.w?`: ${esc(s.w)}`:""}</b><small>${esc(SCARS.find(a=>a[0]===s.n)[1])}</small></div></button>`).join("")}</div>`:""}
       <div class="row sub"><button class="btn primary" id="go" ${x&&si!==null?"":"disabled"}>Spend 1 RP</button><button class="btn" id="cancel">Cancel</button></div>`);
    };
    draw();
    $("#overlay").onclick=e=>{
      if(e.target.id==="overlay")return closeOverlay();
      const b=e.target.closest("button"); if(!b)return;
      if(b.dataset.u){uid=+b.dataset.u;si=null;return draw()}
      if(b.dataset.s){si=+b.dataset.s;return draw()}
      if(b.id==="cancel")return closeOverlay();
      if(b.id==="go"){const x=cands.find(c=>c.id===uid);const s=x.scars.splice(si,1)[0];spend(1,`Field Surgeon: ${x.name} no longer has ${s.n}`)}
    };
  }
  if(kind==="promo"){
    let mode="char",uid=null,enh="";
    const chars=units.me.filter(x=>x.char), vets=units.me.filter(x=>!x.char&&x.xp>=8);
    const draw=()=>{
      const list=mode==="char"?chars:vets;
      showOverlay(`<h4 style="font-family:var(--f-display);font-size:28px;margin:0">Promotion</h4>
       <p class="dim">1 RP. Give a Character an enhancement, or make a Veteran unit's sergeant a Character. You have ${me().rp} RP.</p>
       <div class="seg"><button class="chip" aria-pressed="${mode==="char"}" data-m="char">Character enhancement</button><button class="chip" aria-pressed="${mode==="vet"}" data-m="vet">Veteran becomes Character</button></div>
       <div class="picklist" style="margin-top:12px">${list.length?list.map(c=>`<button class="opt" aria-pressed="${c.id===uid}" data-u="${c.id}"><div><b>${esc(c.name)}</b><small>${esc(c.ds)} · ${RANKS[rankIdx(c.xp)][0]}${c.enh?" · has an enhancement already":""}</small></div></button>`).join(""):`<p class="dim">${mode==="char"?"No Characters on the roster.":"No Veteran units that aren't already Characters."}</p>`}</div>
       ${mode==="char"&&uid?`<div class="field"><label>Enhancement</label><input type="text" id="enh" value="${esc(enh)}" placeholder="Enhancement name and effect"></div>`:""}
       ${mode==="vet"&&uid?`<p class="mono" style="font-size:12px;color:var(--brass)">THE SERGEANT STEPS UP. THE UNIT GAINS THE CHARACTER BADGE.</p>`:""}
       <div class="row sub"><button class="btn primary" id="go" ${uid&&(mode==="vet"||enh.trim())?"":"disabled"}>Spend 1 RP</button><button class="btn" id="cancel">Cancel</button></div>`);
    };
    draw();
    $("#overlay").onclick=e=>{
      if(e.target.id==="overlay")return closeOverlay();
      const b=e.target.closest("button"); if(!b)return;
      if(b.dataset.m){mode=b.dataset.m;uid=null;enh="";return draw()}
      if(b.dataset.u){uid=+b.dataset.u;return draw()}
      if(b.id==="cancel")return closeOverlay();
      if(b.id==="go"){const x=units.me.find(c=>c.id===uid);
        if(mode==="char"){x.enh=enh;spend(1,`Promotion: ${x.name} gains an enhancement`)}else{x.char=true;spend(1,`Promotion: ${x.name} is now a Character`)}}
    };
    $("#overlay").oninput=e=>{if(e.target.id==="enh"){enh=e.target.value;$("#go").disabled=!enh.trim()}};
  }
  if(kind==="recruits"){
    const f={name:"",ds:"",base:100,xp:3,honours:[],scars:[],char:false,war:false,enh:"",legendName:"",ex:false};
    const draw=()=>showOverlay(`<h4 style="font-family:var(--f-display);font-size:28px;margin:0">Seasoned Recruits</h4>
      <p class="dim">2 RP. Add a new unit that starts at 3 XP (Blooded), with its first Battle Honour. You have ${me().rp} RP.</p>
      ${formHTML(f,"recruits")}
      <div class="row sub"><button class="btn primary" id="save">Spend 2 RP and add unit</button><button class="btn" id="cancel">Cancel</button></div>`);
    draw(); bindForm(f,"recruits",draw,()=>{
      if(!f.name.trim())f.name="Seasoned recruits"; f.id=nextId++; f.xp=3; f.ex=false; units.me.push(f);
      spend(2,`Seasoned Recruits: ${f.name} joins at 3 XP`);
    });
  }
}

/* ---------- 5. Post-battle helper ---------- */
let pb=null; // {step, rows:{id:{fought,destroyed,kills,ov}}, glory, res:{}}
function openPB(){
  pb={step:1,glory:null,res:{},rows:{}};
  units.me.forEach(x=>pb.rows[x.id]={fought:false,destroyed:false,kills:0,ov:null});
  // sensible demo defaults so the review shows something
  [[1,{fought:true,kills:1}],[3,{fought:true,kills:2}],[5,{fought:true}],[6,{fought:true,destroyed:true,kills:1}],[4,{fought:true}]].forEach(([id,v])=>{if(pb.rows[id])Object.assign(pb.rows[id],v)});
  if(pb.rows[4])pb.glory=4;
  $("#main").hidden=true;$("#pb").hidden=false;renderPB();window.scrollTo(0,0);
}
function closePB(){pb=null;$("#pb").hidden=true;$("#main").hidden=false;renderMain()}
const gain=(x,r)=>(r.ov!==null&&r.ov!==""?+r.ov:((r.fought&&!r.destroyed?1:0)+(r.fought||pb.glory===x.id?r.kills:0)+(pb.glory===x.id?2:0)));
function renderPB(){
  if(pb.step===1){
    $("#pb").innerHTML=`<h2>Post-battle helper</h2>
     <p class="dim">Step 1 of 2. Who fought? Award XP the way the rules say: +1 to every unit that fought and survived, +1 per enemy unit destroyed, +2 to the one unit Marked for Glory.</p>
     ${units.me.map(x=>{const r=pb.rows[x.id],g=gain(x,r),inGame=r.fought;
      return `<div class="pbunit${inGame?"":" off"}">
       <div class="top" style="display:flex;justify-content:space-between;gap:8px"><div><div class="nm">${esc(x.name)}</div><div class="mono dim" style="font-size:11px">${esc(x.ds.toUpperCase())} · ${x.xp} XP · ${RANKS[rankIdx(x.xp)][0].toUpperCase()}</div></div></div>
       <div class="row" style="margin-top:8px">
         <button class="chip" aria-pressed="${r.fought}" data-t="fought" data-id="${x.id}">Fought</button>
         <button class="chip" aria-pressed="${r.destroyed}" data-t="destroyed" data-id="${x.id}" ${r.fought?"":"disabled"}>Destroyed</button>
         <span class="stepper"><span class="lbl">Kills</span><button class="btn sm" data-k="-1" data-id="${x.id}" ${r.fought&&r.kills>0?"":"disabled"} aria-label="Fewer kills">−</button><output>${r.kills}</output><button class="btn sm" data-k="1" data-id="${x.id}" ${r.fought?"":"disabled"} aria-label="More kills">+</button></span>
         <label class="chip" style="cursor:pointer"><input type="radio" name="glory" data-glory="${x.id}" ${pb.glory===x.id?"checked":""} ${r.fought?"":"disabled"}> Marked for Glory</label>
       </div>
       <div class="xpprev"><span>XP GAIN</span><span class="gain">+${g}</span>
         <span class="dim">${x.xp} → ${x.xp+g}</span>
         <label class="dim" style="margin-left:auto">Override <input type="number" min="0" data-ov="${x.id}" value="${r.ov??""}" placeholder="auto"></label></div>
      </div>`}).join("")}
     <div class="row" style="margin-top:14px"><button class="btn primary" id="next">Next: results</button><button class="btn" id="pcancel">Cancel</button></div>`;
  } else renderPB2();
}
/* derive step-2 work */
function pbWork(){
  return units.me.filter(x=>pb.rows[x.id].fought||pb.glory===x.id).map(x=>{
    const r=pb.rows[x.id], g=gain(x,r), nx=x.xp+g;
    const need=Math.max(0,slots(nx)-x.honours.length)*(rankIdx(nx)>rankIdx(x.xp)?1:0);
    return {x,r,g,nx,need,up:rankIdx(nx)>rankIdx(x.xp)};
  });
}
function dieControl(key,faces,label){
  const v=pb.res[key];
  return `<span class="diebtn"><button class="btn sm" data-roll="${key}" data-f="${faces}">Roll D${faces}</button>
   <select data-set="${key}" aria-label="Enter ${label} result"><option value="">or enter</option>${Array.from({length:faces},(_,i)=>`<option value="${i+1}" ${v==i+1?"selected":""}>${i+1}</option>`).join("")}</select>
   <span class="die">${v||"·"}</span></span>`;
}
function renderPB2(){
  const work=pbWork(); let blocked=false, any=false, html="";
  const ups=work.filter(w=>w.up&&w.need>0);
  html+=`<h3 style="margin-top:6px">Rank-ups</h3>`;
  if(!ups.length)html+=`<p class="dim">Nobody ranked up this time.</p>`;
  ups.forEach(w=>{
    any=true;
    const held=new Set(w.x.honours);
    for(let i=0;i<w.need;i++){
      const key=`h${w.x.id}_${i}`, chosen=pb.res[key+"c"];
      const rolled=pb.res[key], rolledName=rolled?HONOURS[rolled-1][0]:null;
      const dup=rolledName&&held.has(rolledName)&&!chosen;
      if(!chosen)blocked=true;
      html+=`<div class="res"><div class="rt">${esc(w.x.name)} reaches ${RANKS[rankIdx(w.nx)][0]}</div>
       <div class="mono dim" style="font-size:12px">${w.x.xp} → ${w.nx} XP · NEW BATTLE HONOUR ${w.need>1?`${i+1} of ${w.need}`:""}</div>
       <div class="row" style="margin-top:8px">${dieControl(key,6,"honour D6")}
        <select data-pick="${key}" aria-label="Pick an honour"><option value="">Pick from list</option>${HONOURS.map(h=>`<option value="${esc(h[0])}" ${held.has(h[0])?"disabled":""} ${chosen===h[0]?"selected":""}>${esc(h[0])}${held.has(h[0])?" (held)":""}</option>`).join("")}</select></div>
       ${dup?`<div class="out bad">Rolled ${rolled}: ${esc(rolledName)}, already held. Re-roll, or pick another from the list.</div>`
        :rolledName&&!chosen?`<div class="out">Rolled ${rolled}: ${esc(rolledName)}. ${esc(HONOURS[rolled-1][1])} <button class="btn sm" data-accept="${key}" data-n="${esc(rolledName)}">Take it</button></div>`:""}
       ${chosen?`<div class="out">Gains <b>${esc(chosen)}</b>. ${esc(HONOURS.find(h=>h[0]===chosen)[1])}</div>`:""}
      </div>`;
      if(chosen)held.add(chosen);
    }
  });
  html+=`<h3>Roll for the fallen</h3>`;
  const fallen=work.filter(w=>w.r.destroyed);
  if(!fallen.length)html+=`<p class="dim">No units were destroyed.</p>`;
  const removed=[];
  fallen.forEach(w=>{
    any=true; const x=w.x, thr=x.char?2:1, mod=x.honours.includes("Hard to Kill")?1:0;
    const k="f"+x.id, d6=pb.res[k], total_=d6?d6+mod:null;
    html+=`<div class="res"><div class="rt">${esc(x.name)} was destroyed</div>
     <div class="mono dim" style="font-size:12px">${x.char?"CHARACTER: SCAR ON 1–2":"SCAR ON A 1"}${mod?" · HARD TO KILL: +1 TO THE ROLL":""} · HAS ${x.scars.length} SCAR${x.scars.length===1?"":"S"}</div>
     <div class="row" style="margin-top:8px">${dieControl(k,6,"fallen D6")}</div>`;
    if(!d6){blocked=true}
    else{
      const scarred=total_<=thr;
      html+=`<div class="out ${scarred?"bad":""}">D6 ${d6}${mod?` +${mod} = ${total_}`:""}: ${scarred?`Scarred (needs ${thr} or less).`:`No scar (needs ${thr} or less). The unit lives to fight on.`}</div>`;
      if(scarred){
        const s=pb.res["s"+x.id], held=x.scars.map(a=>a.n), sn=s?SCARS[s-1][0]:null, dupS=sn&&held.includes(sn);
        html+=`<div class="row" style="margin-top:8px"><span class="lbl">Battle Scar</span>${dieControl("s"+x.id,3,"scar D3")}</div>`;
        if(!s)blocked=true;
        else if(dupS){blocked=true;html+=`<div class="out bad">Rolled ${s}: ${sn}, which the unit already has. Duplicates don't stack: re-roll the D3.</div>`}
        else {
          html+=`<div class="out bad">Rolled ${s}: <b>${sn}</b>. ${esc(SCARS[s-1][1])}</div>`;
          if(sn==="Worn Gear"){const w=pb.res["w"+x.id]||"";if(!w.trim())blocked=true;
            html+=`<div class="field" style="margin-top:8px"><label>Which weapon is worn?</label><input type="text" data-wg="${x.id}" value="${esc(w)}" placeholder="e.g. bolt rifles"></div>`}
          if(x.scars.length+1>=3){removed.push(x.id);html+=`<div class="out gone">THIRD SCAR: ${esc(x.name)} is removed from your roster.</div>`}
        }
      }
    }
    html+=`</div>`;
  });
  if(!any)html+="";
  const summary=work.map(w=>`<tr><td>${esc(w.x.name)}</td><td class="n">+${w.g} XP</td><td>${RANKS[rankIdx(w.nx)][0]}</td></tr>`).join("");
  $("#pb").innerHTML=`<h2>Post-battle results</h2>
   <p class="dim">Step 2 of 2. Roll the dice at the table and enter them, or let the app roll. Nothing is saved until you confirm.</p>
   <div class="tbl"><table><thead><tr><th>Unit</th><th>XP</th><th>Rank</th></tr></thead><tbody>${summary||`<tr><td colspan="3" class="dim">No units fought.</td></tr>`}</tbody></table></div>
   ${html}
   <div class="row sub"><button class="btn primary" id="confirm" ${blocked?"disabled":""}>Confirm and save</button><button class="btn" id="back">Back</button><button class="btn" id="pcancel">Cancel</button></div>
   ${blocked?`<div class="msg" style="margin-top:6px">Finish the rolls above to confirm.</div>`:""}`;
  pb.removed=removed;
}
$("#pb").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  const id=b.dataset.id, r=id&&pb.rows[id];
  if(b.dataset.t==="fought"){r.fought=!r.fought;if(!r.fought){r.destroyed=false;r.kills=0;if(pb.glory==id)pb.glory=null}return renderPB()}
  if(b.dataset.t==="destroyed"){r.destroyed=!r.destroyed;return renderPB()}
  if(b.dataset.k){r.kills=Math.max(0,r.kills+ +b.dataset.k);return renderPB()}
  if(b.id==="next"){pb.step=2;renderPB();return window.scrollTo(0,0)}
  if(b.id==="back"){pb.step=1;return renderPB()}
  if(b.id==="pcancel")return closePB();
  if(b.dataset.roll){const f=+b.dataset.f;pb.res[b.dataset.roll]=1+Math.floor(Math.random()*f);if(b.dataset.roll[0]==="h")delete pb.res[b.dataset.roll+"c"];return renderPB()}
  if(b.dataset.accept){pb.res[b.dataset.accept+"c"]=b.dataset.n;return renderPB()}
  if(b.id==="confirm"){
    pbWork().forEach(w=>{const x=w.x;x.xp=w.nx;
      for(let i=0;i<w.need;i++){const c=pb.res[`h${x.id}_${i}c`];if(c&&!x.honours.includes(c))x.honours.push(c)}
      if(w.r.destroyed){const k="f"+x.id,d=pb.res[k],thr=x.char?2:1,mod=x.honours.includes("Hard to Kill")?1:0;
        if(d&&d+mod<=thr){const s=pb.res["s"+x.id];const sc={n:SCARS[s-1][0]};if(sc.n==="Worn Gear")sc.w=pb.res["w"+x.id];x.scars.push(sc)}}});
    units.me=units.me.filter(x=>!pb.removed.includes(x.id));
    msg="Battle recorded: XP, honours and scars saved."+(pb.removed.length?" A unit was lost to its third scar.":"");
    closePB();
  }
});
$("#pb").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.glory){pb.glory=+t.dataset.glory;return renderPB()}
  if(t.dataset.ov!==undefined){pb.rows[t.dataset.ov].ov=t.value===""?null:Math.max(0,+t.value);return renderPB()}
  if(t.dataset.set){pb.res[t.dataset.set]=t.value?+t.value:undefined;if(t.dataset.set[0]==="h")delete pb.res[t.dataset.set+"c"];return renderPB()}
  if(t.dataset.pick){if(t.value)pb.res[t.dataset.pick+"c"]=t.value;else delete pb.res[t.dataset.pick+"c"];return renderPB()}
});
$("#pb").addEventListener("input",e=>{
  if(e.target.dataset.wg)pb.res["w"+e.target.dataset.wg]=e.target.value;
});
/* Confirm re-evaluates when the weapon field loses focus */
$("#pb").addEventListener("focusout",e=>{ if(e.target.dataset&&e.target.dataset.wg)renderPB(); });

/* ---------- Mock jump bar ---------- */
const JUMPS=[
 ["Roster (own)",()=>{closeOverlay();if(pb)closePB();viewing="me";if(!units.me.length)units.me=EXAMPLES();msg="";renderMain()}],
 ["Viewing another player",()=>{closeOverlay();if(pb)closePB();viewing="p2";renderMain()}],
 ["Empty roster",()=>{closeOverlay();if(pb)closePB();viewing="me";units.me=[];msg="";renderMain()}],
 ["Add unit form",()=>{if(pb)closePB();viewing="me";if(!units.me.length)units.me=EXAMPLES();renderMain();openForm()}],
 ["Edit unit form",()=>{if(pb)closePB();viewing="me";if(!units.me.length)units.me=EXAMPLES();renderMain();openForm(units.me[5])}],
 ["Post-battle 1",()=>{closeOverlay();if(pb)closePB();viewing="me";if(!units.me.length)units.me=EXAMPLES();renderMain();openPB()}],
 ["Post-battle 2",()=>{closeOverlay();if(pb)closePB();viewing="me";if(!units.me.length)units.me=EXAMPLES();renderMain();openPB();pb.step=2;renderPB()}],
 ["Field Surgeon",()=>{if(pb)closePB();viewing="me";if(!units.me.length)units.me=EXAMPLES();me().rp=Math.max(me().rp,4);renderMain();openRP("surgeon")}],
 ["Promotion",()=>{if(pb)closePB();viewing="me";if(!units.me.length)units.me=EXAMPLES();me().rp=Math.max(me().rp,4);renderMain();openRP("promo")}],
 ["Seasoned Recruits",()=>{if(pb)closePB();viewing="me";if(!units.me.length)units.me=EXAMPLES();me().rp=Math.max(me().rp,4);renderMain();openRP("recruits")}]];
$("#jump").innerHTML=JUMPS.map((j,i)=>`<button class="chip" data-j="${i}">${j[0]}</button>`).join("");
$("#jump").addEventListener("click",e=>{const b=e.target.closest("button");if(b)JUMPS[+b.dataset.j][1]()});

renderMain();
</script>
