<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Turn Flow — The Varkesh Reach</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gothic:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Share+Tech+Mono&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Tokens copied verbatim from reference/index.html */
:root{
  --bg:#16120f; --panel:#211a16; --panel2:#2a211c; --line:#3d312a;
  --ink:#ebdfc8; --dim:#a8977f; --brass:#d0a952; --blood:#b8392e; --verd:#6f9a86;
  --f-display:"Grenze Gothic","Palatino Linotype",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  /* Flag categories: three tokens used directly, the fourth is a mix of two tokens (no new hue) */
  --c-dead:var(--blood);
  --c-nochoice:var(--brass);
  --c-manual:var(--verd);
  --c-diverge:color-mix(in srgb,var(--blood) 45%,var(--ink));
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
header.hero{padding-block:28px 18px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,9vw,56px);line-height:.98;margin:6px 0 10px;text-wrap:balance;letter-spacing:.01em}
h1 span{color:var(--blood)}
.lede{color:var(--dim);max-width:62ch;margin:0 0 8px}
.snap{font-family:var(--f-mono);font-size:12px;color:var(--dim);margin:0}
p{margin:0 0 12px;max-width:65ch}
.dim{color:var(--dim)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{font-family:var(--f-mono);font-size:13px;letter-spacing:.05em;text-transform:uppercase;background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:9px 14px;min-height:40px;border-radius:2px;cursor:pointer}

/* Filter bar */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fchip{display:flex;align-items:center;gap:8px;text-align:left;min-height:48px;padding:6px 10px;background:none;border:1px solid var(--line);border-radius:3px;cursor:pointer;color:var(--dim);font-size:14px;line-height:1.2}
.fchip .sw{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--cat);background:transparent}
.fchip .n{margin-left:auto;font-family:var(--f-mono);font-size:12px}
.fchip[aria-pressed="true"]{border-color:var(--cat);color:var(--ink);background:var(--panel2)}
.fchip[aria-pressed="true"] .sw{background:var(--cat)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.ctl .hint{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-left:auto}
[data-cat="dead"]{--cat:var(--c-dead)} [data-cat="nochoice"]{--cat:var(--c-nochoice)}
[data-cat="manual"]{--cat:var(--c-manual)} [data-cat="diverge"]{--cat:var(--c-diverge)}

/* Layout */
.cols{display:block}
.crumb{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--dim);padding:12px 0 4px;min-height:44px}
.crumb button{background:none;border:0;padding:6px 4px;min-height:32px;color:var(--brass);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.crumb .sep{opacity:.5}
.crumb .cur{color:var(--ink)}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 0 12px;font-size:13.5px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Type tags (rectangular) — distinct from category badges (round) */
.tt{flex:none;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:1px 6px;border-radius:2px;border:1px solid var(--t);color:var(--t);white-space:nowrap}
[data-type="decision"]{--t:var(--brass)} [data-type="decision"].tt{background:var(--brass);color:var(--bg)}
[data-type="engine"]{--t:var(--dim)}
[data-type="table"]{--t:var(--verd)} [data-type="table"].tt{border-style:dashed}
[data-type="boundary"]{--t:var(--blood)} [data-type="boundary"].tt{background:var(--blood);color:var(--ink)}
[data-type="edge"]{--t:var(--blood)} [data-type="edge"].tt{border-style:dotted;border-width:2px}

/* Tree */
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:14px;border-left:1px solid var(--line);padding-left:0}
li.node{position:relative}
.nrow{display:flex;align-items:stretch;min-height:44px;border-left:3px solid transparent;border-radius:0 3px 3px 0}
li.node[data-type] > .nrow{border-left-color:var(--t)}
.chev{flex:none;width:40px;min-height:44px;background:none;border:0;cursor:pointer;color:var(--dim);display:flex;align-items:center;justify-content:center}
.chev svg{width:14px;height:14px;transition:transform .12s}
li.node.open > .nrow .chev svg{transform:rotate(90deg)}
.chev.leaf{cursor:default;opacity:.3}
.nmain{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;background:none;border:0;padding:6px 8px 6px 0;cursor:pointer}
.nline{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ntitle{font-family:var(--f-display);font-size:19px;line-height:1.15}
.navail{font-size:13px;color:var(--dim);font-style:italic}
.badges{display:inline-flex;gap:3px;margin-left:auto}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--cat);color:var(--bg);font-family:var(--f-mono);font-size:11px;font-weight:700}
li.node.onpath > .nrow{background:color-mix(in srgb,var(--brass) 8%,transparent)}
li.node.onpath > .nrow .ntitle{color:var(--brass)}
li.node.sel > .nrow{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--brass)}
li.node.faded > .nrow{opacity:.38}
li.node:not(.open) > ul{display:none}
.grp > .nrow .ntitle{font-size:17px;font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}

/* Detail panel */
.detail{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:62vh;overflow:auto;background:var(--panel);border-top:2px solid var(--brass);padding:14px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px #000a}
.detail h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;margin:6px 0 8px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:40px;height:40px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;cursor:pointer;font-size:18px;line-height:1}
.ref{font-family:var(--f-mono);font-size:12.5px;color:var(--brass);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:6px 9px;display:inline-block;margin:0 0 12px;overflow-wrap:anywhere}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
.flag{border-left:3px solid var(--cat);background:var(--bg);padding:8px 12px;margin:0 0 8px;border-radius:0 3px 3px 0}
.flag.off{opacity:.4}
.cchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:2px 9px;border:1px solid var(--cat);border-radius:20px;color:var(--cat);margin-bottom:4px}
.cchip i{width:8px;height:8px;border-radius:50%;background:var(--cat)}
.flag p{margin:0;font-size:15px}
.noflags{color:var(--dim);font-style:italic}
.spacer{height:0}
body.has-sel .spacer{height:56vh}

@media (min-width:960px){
  .fgrid{grid-template-columns:repeat(4,1fr)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
  .detail{position:sticky;top:150px;left:auto;right:auto;bottom:auto;max-height:calc(100vh - 170px);margin-top:12px;border:1px solid var(--line);border-top:2px solid var(--brass);border-radius:3px;padding:16px;box-shadow:none}
  .detail.empty{display:block!important}
  .x{display:none}
  body.has-sel .spacer{height:0}
}
.detail.empty{display:none}
@media (min-width:960px){.detail.empty{display:block}}
.empty-msg{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="eyebrow">Design review · public, read-only</div>
  <h1>Turn Flow <span>—</span> anatomy of a War Round turn</h1>
  <p class="lede">One player's turn, laid out as a decision tree. Open a branch to follow it, tap a step to see where it lives in the code and what is flagged as needing work.</p>
  <p class="snap">Snapshot of the rules as of 21 Oct 2026</p>
</header>

<div class="filters" role="group" aria-label="Flag filters">
  <div class="fgrid" id="fgrid"></div>
  <div class="ctl">
    <button class="btn" id="expAll">Expand all</button>
    <button class="btn" id="colAll">Collapse all</button>
    <span class="hint" id="hint"></span>
  </div>
</div>

<div class="cols">
  <main>
    <nav class="crumb" id="crumb" aria-label="Path to selected step"></nav>
    <div class="legend" id="legend" aria-label="Node type legend"></div>
    <ul class="tree" id="tree" role="tree"></ul>
    <div class="spacer"></div>
  </main>
  <aside class="detail empty" id="detail" aria-live="polite" aria-label="Step detail"></aside>
</div>
</div>

<script>
/* ---------- Single data structure (reusable shape) ----------
   node: { id, parent, type, title, avail?, desc, ref, flags:[{cat, text}], open? }
   type: decision | engine | table | boundary | edge   (group = decision with grp:true)
   cat:  dead | nochoice | manual | diverge                                           */
const CATS = [
  {id:'dead',     label:'Dead ends & stuck states'},
  {id:'nochoice', label:'No meaningful choice'},
  {id:'manual',   label:'Manual / unenforced'},
  {id:'diverge',  label:'Code vs rules divergence'}
];
const TYPES = [
  {id:'decision', label:'Decision', note:'player chooses'},
  {id:'engine',   label:'Engine',   note:'automatic'},
  {id:'table',    label:'Table',    note:'resolved off-app'},
  {id:'boundary', label:'Boundary', note:'turn / round end'},
  {id:'edge',     label:'Edge case', note:'rare path'}
];
const NODES = [
  {id:'start', parent:null, type:'boundary', title:"Player's turn begins", open:true,
   desc:"The War Round has started and it is this player's place in the turn order (smallest empire first). The app marks them as current and shows the action choices.",
   ref:'engine.ts · beginRound() / currentPlayer()',
   flags:[]},

  {id:'choose', parent:'start', type:'decision', title:'Choose an action', open:true,
   avail:'one action per turn',
   desc:"Pick one campaign action: Conquer, Raid, Recuperate, Muster, Fortify or Scout. Conquer and Raid start a battle; the rest build the player up without fighting.",
   ref:'engine.ts · ACTIONS, targets()',
   flags:[{cat:'dead', text:'Player with no legal target and no RP for a quiet action has only Recuperate; if that is also capped, the turn can be neither played nor skipped.'}]},

  {id:'grpB', parent:'choose', type:'decision', grp:true, title:'Battle actions', open:true,
   desc:'Actions that lead to a battle with another player or a garrison.', ref:'engine.ts · ACTIONS (kind: "b")', flags:[]},

  {id:'conquer', parent:'grpB', type:'decision', title:'Conquer',
   avail:'needs ≥2 players and a legal target',
   desc:'Attack a province to take it. The winner holds it at the end of the battle.',
   ref:'engine.ts · targets(), rollBattle()',
   flags:[{cat:'nochoice', text:'When only one legal target exists the target step is auto-picked, so the choice is skipped.'}]},

  {id:'raid', parent:'grpB', type:'decision', title:'Raid',
   avail:'needs ≥2 players and a legal target',
   desc:'Strike a province for spoils without intending to hold it. Uses the same target and battle path as Conquer.',
   ref:'engine.ts · ACTIONS.raid, resolve()',
   flags:[{cat:'diverge', text:'Raid rewards are applied in resolve() with the same code path as Conquer; the written rule gives different rewards.'}]},

  {id:'target', parent:'grpB', type:'decision', title:'Choose a target', open:true,
   avail:'provinces adjacent by land or warp lane',
   desc:'Pick which province to attack from those the player can reach. Unoccupied provinces are fought as garrison battles.',
   ref:'engine.ts · targets()',
   flags:[{cat:'dead', text:'Homeless player with no unclaimed outer provinces has no way back onto the map.'}]},

  {id:'defender', parent:'target', type:'engine', title:'Defender identified', open:true,
   desc:"The province's holder becomes the defender. If nobody holds it, a garrison is generated instead of a player opponent.",
   ref:'engine.ts · battleInfo()', flags:[]},

  {id:'twists', parent:'defender', type:'engine', title:'Roll Mission Twist(s)', open:true,
   avail:'inner worlds roll two twists',
   desc:'D12 on the Mission Twist table. Inner worlds roll two. The twist text is shown to both players.',
   ref:'engine.ts · TWISTS, rollBattle()',
   flags:[{cat:'nochoice', text:'Re-roll twists is unlimited and free in the app.'}]},

  {id:'size', parent:'twists', type:'engine', title:'Battle size', open:true,
   desc:'Province type sets the base points; orbit tier multiplies it (outer ×1, middle ×1.5, inner ×2).',
   ref:'engine.ts · PTYPES, ORBITS, battleInfo()', flags:[]},

  {id:'play', parent:'size', type:'table', title:'Play the game', open:true,
   desc:'Players fight a normal game of 40k at the table. The app waits for a result.',
   ref:'(off-app)',
   flags:[{cat:'manual', text:'Nothing checks the armies match the battle size or that the twist was applied.'}]},

  {id:'result', parent:'play', type:'decision', title:'Report the result', open:true,
   avail:'attacker, defender or owner',
   desc:'Choose the winner. The app records it and applies the outcomes.',
   ref:'engine.ts · resolve()',
   flags:[{cat:'manual', text:'The app trusts the reported winner; there is no confirmation from the other player.'}]},

  {id:'outcomes', parent:'result', type:'engine', title:'Outcomes applied',
   desc:'Province changes hands, both sides earn RP, supply limit grows, Underdog’s grit may draw a Fate Card, and the log is written.',
   ref:'engine.ts · resolve()',
   flags:[
     {cat:'diverge', text:'Resolve logs "+150 supply" for both players but never adds it to sup.'},
     {cat:'diverge', text:'Underdog’s grit follows the written rule (any player on the fewest provinces), not the prototype code.'}]},

  {id:'ends', parent:'outcomes', type:'boundary', title:'Turn ends',
   desc:'The turn passes to the next player in order. If everyone has played, the War Round ends.',
   ref:'engine.ts · endTurn()', flags:[]},

  {id:'grpQ', parent:'choose', type:'decision', grp:true, title:'Quiet actions', open:true,
   desc:'Actions that build the player up without a battle.', ref:'engine.ts · ACTIONS (kind: "q")', flags:[]},

  {id:'recup', parent:'grpQ', type:'decision', title:'Recuperate',
   desc:'Rest and recover. Resolved immediately by the engine.', ref:'engine.ts · doQuiet("recuperate")',
   flags:[{cat:'nochoice', text:'Always available and free, so it is the default when nothing else is possible.'}]},
  {id:'muster', parent:'grpQ', type:'decision', title:'Muster',
   avail:'costs RP',
   desc:'Spend RP to bring in reinforcements.', ref:'engine.ts · doQuiet("muster")', flags:[]},
  {id:'fortify', parent:'grpQ', type:'decision', title:'Fortify',
   avail:'needs a held province',
   desc:'Strengthen a province you hold.', ref:'engine.ts · doQuiet("fortify")',
   flags:[{cat:'manual', text:'The fortification bonus is only a log line; players apply it by hand in the next battle.'}]},
  {id:'scout', parent:'grpQ', type:'decision', title:'Scout',
   desc:'Gather information on the Reach and neighbouring worlds.', ref:'engine.ts · doQuiet("scout")', flags:[]},

  {id:'any', parent:'start', type:'decision', grp:true, title:'Any time in the turn', open:true,
   desc:'Side-decisions a player can make whenever it suits them, without using their action.',
   ref:'CampaignStore · playCard(), discardCard(), spendRP()', flags:[]},

  {id:'card', parent:'any', type:'decision', title:'Play or discard a Fate Card',
   avail:'own hand only; limit 5',
   desc:'Play a card from your hand, or discard to make room. Others only see your hand count.',
   ref:'engine.ts · drawCard(), poolFor()',
   flags:[{cat:'manual', text:'Fate Card effects: play/discard only removes the card.'}]},
  {id:'rp', parent:'any', type:'decision', title:'Spend RP',
   avail:'own RP, or owner for anyone',
   desc:'Spend Requisition Points on options the rules allow.', ref:'engine.ts · spendRP()',
   flags:[{cat:'manual', text:'What RP buys is not enforced; the counter just goes down.'}]},

  {id:'homeless', parent:'start', type:'edge', title:'Player has no provinces',
   avail:'only after losing their last province',
   desc:'A player who has lost every province still has a turn in the order.',
   ref:'engine.ts · targets()',
   flags:[{cat:'dead', text:'Homeless player with no unclaimed outer provinces has no way back onto the map.'}]},

  {id:'roundEnd', parent:'start', type:'boundary', title:'War Round ends',
   avail:'after the last player’s turn',
   desc:'Hollowgate check runs; once open it stays open. The next War Round draws a Fate Card for everyone.',
   ref:'engine.ts · hollOpen(), beginRound()',
   flags:[{cat:'diverge', text:'Prototype re-evaluated hollOpen() every round; the app latches it with state.hollOpened.'}]}
];

/* ---------- State ---------- */
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const kids = id => NODES.filter(n => n.parent === id);
const active = new Set(CATS.map(c => c.id));
const open = new Set(NODES.filter(n => n.open).map(n => n.id));
let sel = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pathTo = id => { const p = []; for (let n = byId[id]; n; n = byId[n.parent]) p.unshift(n); return p; };
const glyph = {decision:'◆', engine:'⚙', table:'▤', boundary:'■', edge:'⚠'};

function total(cat){ return NODES.reduce((a,n)=>a+n.flags.filter(f=>f.cat===cat).length,0); }
const visFlags = n => n.flags.filter(f => active.has(f.cat));
/* a node is "relevant" if it, or any descendant, has a visible flag */
function relevant(n){ return visFlags(n).length > 0 || kids(n.id).some(relevant); }

/* ---------- Render ---------- */
function renderFilters(){
  $('#fgrid').innerHTML = CATS.map(c =>
    `<button class="fchip" data-cat="${c.id}" aria-pressed="${active.has(c.id)}">
       <span class="sw"></span><span>${c.label}</span><span class="n">${total(c.id)}</span></button>`).join('');
  $('#fgrid').querySelectorAll('.fchip').forEach(b => b.onclick = () => {
    const c = b.dataset.cat; active.has(c) ? active.delete(c) : active.add(c); render();
  });
}
function renderLegend(){
  $('#legend').innerHTML = TYPES.map(t =>
    `<span><span class="tt" data-type="${t.id}">${glyph[t.id]} ${t.label}</span>${t.note}</span>`).join('');
}
function nodeHTML(n){
  const k = kids(n.id), onPath = sel && pathTo(sel).some(p => p.id === n.id) && n.id !== sel;
  const filtering = active.size < CATS.length;
  const faded = filtering && !relevant(n);
  const counts = CATS.filter(c => active.has(c.id)).map(c => [c, n.flags.filter(f => f.cat === c.id).length]).filter(x => x[1]);
  const cls = ['node', n.grp ? 'grp' : '', open.has(n.id) ? 'open' : '', onPath ? 'onpath' : '', sel === n.id ? 'sel' : '', faded ? 'faded' : ''].join(' ');
  return `<li class="${cls}" data-type="${n.type}" data-id="${n.id}" role="treeitem"${k.length ? ` aria-expanded="${open.has(n.id)}"` : ''}>
    <div class="nrow">
      ${k.length
        ? `<button class="chev" data-chev="${n.id}" aria-label="${open.has(n.id) ? 'Collapse' : 'Expand'} ${esc(n.title)}"><svg viewBox="0 0 10 10"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>`
        : `<span class="chev leaf" aria-hidden="true"><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="1.6" fill="currentColor"/></svg></span>`}
      <button class="nmain" data-sel="${n.id}">
        <span class="nline">
          <span class="ntitle">${esc(n.title)}</span>
          <span class="tt" data-type="${n.type}">${glyph[n.type]} ${n.grp ? 'Group' : TYPES.find(t => t.id === n.type).label}</span>
          <span class="badges">${counts.map(([c,v]) => `<span class="bdg" data-cat="${c.id}" title="${c.label}">${v}</span>`).join('')}</span>
        </span>
        ${n.avail ? `<span class="navail">${esc(n.avail)}</span>` : ''}
      </button>
    </div>
    ${k.length ? `<ul role="group">${k.map(nodeHTML).join('')}</ul>` : ''}
  </li>`;
}
function renderTree(){
  const root = NODES.find(n => !n.parent);
  $('#tree').innerHTML = nodeHTML(root);
  $('#tree').querySelectorAll('[data-chev]').forEach(b => b.onclick = e => {
    const id = b.dataset.chev; open.has(id) ? open.delete(id) : open.add(id); renderTree();
  });
  $('#tree').querySelectorAll('[data-sel]').forEach(b => b.onclick = () => select(b.dataset.sel));
}
function renderCrumb(){
  if (!sel){ $('#crumb').innerHTML = '<span>Select a step to trace its path from the start of the turn.</span>'; return; }
  const p = pathTo(sel);
  $('#crumb').innerHTML = p.map((n,i) => i === p.length - 1
    ? `<span class="cur">${esc(n.title)}</span>`
    : `<button data-go="${n.id}">${esc(n.title)}</button><span class="sep">›</span>`).join('');
  $('#crumb').querySelectorAll('[data-go]').forEach(b => b.onclick = () => select(b.dataset.go));
}
function renderDetail(){
  const d = $('#detail');
  document.body.classList.toggle('has-sel', !!sel);
  if (!sel){
    d.className = 'detail empty';
    d.innerHTML = '<p class="empty-msg">Tap a step in the tree to see what it does, where it lives in the code, and what is flagged.</p>';
    return;
  }
  const n = byId[sel];
  d.className = 'detail';
  d.innerHTML = `
    <div class="dhead"><span class="tt" data-type="${n.type}">${glyph[n.type]} ${n.grp ? 'Group' : TYPES.find(t => t.id === n.type).label}</span>
      <button class="x" id="closeD" aria-label="Close detail">✕</button></div>
    <h2>${esc(n.title)}</h2>
    ${n.avail ? `<p class="navail">${esc(n.avail)}</p>` : ''}
    <p>${esc(n.desc)}</p>
    <div class="lbl">Source</div>
    <code class="ref">${esc(n.ref)}</code>
    <div class="lbl">Flags (${n.flags.length})</div>
    ${n.flags.length ? n.flags.map(f => {
      const c = CATS.find(c => c.id === f.cat);
      return `<div class="flag ${active.has(f.cat) ? '' : 'off'}" data-cat="${f.cat}">
        <span class="cchip" data-cat="${f.cat}"><i></i>${c.label}</span><p>${esc(f.text)}</p></div>`;
    }).join('') : '<p class="noflags">No flags on this step.</p>'}`;
  $('#closeD').onclick = () => select(null);
}
function select(id){ sel = (id === sel && window.innerWidth < 960) ? null : id;
  if (sel) pathTo(sel).forEach(p => p.id !== sel && open.add(p.id));
  renderTree(); renderCrumb(); renderDetail(); }
function render(){
  renderFilters(); renderTree(); renderCrumb(); renderDetail();
  const shown = NODES.reduce((a,n)=>a+visFlags(n).length,0);
  $('#hint').textContent = shown + ' of ' + NODES.reduce((a,n)=>a+n.flags.length,0) + ' flags shown';
}
$('#expAll').onclick = () => { NODES.forEach(n => kids(n.id).length && open.add(n.id)); renderTree(); };
$('#colAll').onclick = () => { open.clear(); open.add(NODES.find(n=>!n.parent).id); renderTree(); };
renderLegend(); render();
</script>
</body>
</html>
